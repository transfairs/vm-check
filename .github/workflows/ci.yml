name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build (release)
        run: cargo build --workspace --release

      # GitHub Actions runners are themselves VMs, so running the real binary
      # is a genuine end-to-end smoke test requiring no mocking at all. Not
      # every runner trips enough weighted signals to clear the deliberately
      # high VM_THRESHOLD (see report.rs), so "uncertain" (2) is an accepted
      # outcome here too; only "likely physical" (0) is a real failure.
      - name: Smoke test - verdict should not be LikelyPhysicalMachine on this runner
        if: runner.os == 'Linux'
        run: |
          ./target/release/vm-check --no-elevate --json | tee report.json
          exit_code=0
          ./target/release/vm-check --no-elevate || exit_code=$?
          if [ "$exit_code" -ne 1 ] && [ "$exit_code" -ne 2 ]; then
            echo "Expected a VM or uncertain verdict (exit 1 or 2) on a CI runner, got $exit_code"
            exit 1
          fi

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          exit_code=0
          ./target/release/vm-check.exe --json || exit_code=$?
          if [ "$exit_code" -ne 1 ] && [ "$exit_code" -ne 2 ]; then
            echo "Expected a VM or uncertain verdict (exit 1 or 2) on a CI runner, got $exit_code"
            exit 1
          fi
