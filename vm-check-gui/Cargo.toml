[package]
name = "vm-check-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform GUI for vm-check."

[[bin]]
name = "vm-check-gui"
path = "src/main.rs"

[dependencies]
vm-check-core.workspace = true
eframe = { version = "0.29", features = ["persistence"] }
egui_extras = { version = "0.29", features = ["image"] }
serde.workspace = true
sys-locale = "0.3"

# Not target-gated: build.rs itself always compiles for the host, so this
# must be resolvable regardless of host OS. It's a no-op unless the actual
# build *target* (checked at build.rs runtime, not via Cargo.toml gating) is
# Windows, see build.rs.
[build-dependencies]
winresource = "0.1"
